<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Visor de proyectos de la Red Matriz de Acueducto</title>
<meta name="description" content="Mapa de los proyectos de la Dirección Red Matriz Acueducto: contratos de obra e interventoría, avance, plazos, valores y geometría de cada obra.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%230F2B3D'/%3E%3Cpath d='M16 6c4 5 7 8.5 7 12a7 7 0 0 1-14 0c0-3.500 3-7 7-12z' fill='%2333C6D4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --bg:#EEF3F6; --surface:#FFFFFF; --surface-2:#F5F8FA; --ink:#0F2B3D; --ink-2:#51697A; --line:#DBE4EA; --track:#E3EBF0;
  --pipe:#1769A8; --casing:#FFFFFF; --water:#0E9FB0; --warn:#E39A26; --bad:#D4472F; --ok:#2A9461; --indigo:#5B5BD6;
  --primary:#0F2B3D; --on-primary:#FFFFFF; --shadow:0 10px 30px rgba(15,43,61,.16), 0 2px 6px rgba(15,43,61,.10);
  --display:'Bricolage Grotesque', 'Public Sans', system-ui, sans-serif; --text:'Public Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --panel-w:372px; --drawer-w:540px;
}
:root[data-theme="dark"]{
  --bg:#0A1620; --surface:#10212D; --surface-2:#152A38; --ink:#E8F1F6; --ink-2:#97AEBD; --line:#23394A; --track:#1C3242;
  --pipe:#5DB9F2; --casing:#0A1620; --water:#2FC6D6; --warn:#F0B04A; --bad:#F2765F; --ok:#4CC38A; --indigo:#8E8EF5;
  --primary:#2FC6D6; --on-primary:#06222A; --shadow:0 10px 30px rgba(0,0,0,.5), 0 2px 6px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--text);color:var(--ink);background:var(--bg);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--water);outline-offset:2px;border-radius:6px}
#app{position:fixed;inset:0}
#map{position:absolute;inset:0;background:var(--bg)}
.leaflet-container{font-family:var(--text);background:var(--bg)}
.leaflet-control-zoom{border:none!important;box-shadow:var(--shadow)!important;border-radius:12px!important;overflow:hidden}
.leaflet-control-zoom a{background:var(--surface)!important;color:var(--ink)!important;border-color:var(--line)!important;width:34px!important;height:34px!important;line-height:34px!important}
.leaflet-control-attribution{background:color-mix(in srgb,var(--surface) 82%,transparent)!important;color:var(--ink-2)!important;font-size:10.5px;border-radius:8px 0 0 0}
.leaflet-control-attribution a{color:var(--ink-2)!important}
.leaflet-tooltip{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);font:500 12.5px var(--text);padding:5px 9px}
.leaflet-tooltip-top:before{border-top-color:var(--surface)}

/* ---------- Panel izquierdo ---------- */
#panel{position:absolute;z-index:1100;top:14px;left:14px;width:var(--panel-w);max-height:calc(100% - 28px);display:flex;flex-direction:column;background:var(--surface);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.p-head{display:flex;align-items:center;gap:12px;padding:16px 16px 12px}
.logo{flex:none;width:40px;height:40px}
.p-head h1{font:700 19px/1.15 var(--display);letter-spacing:-.01em;margin:0}
.p-head p{margin:2px 0 0;color:var(--ink-2);font-size:12.5px}
.icon-btn{flex:none;width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink-2);transition:background .15s,color .15s}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.p-head .spacer{flex:1}
.p-body{overflow:auto;padding:0 16px 14px;display:flex;flex-direction:column;gap:14px;min-height:0}
#panel.collapsed .p-body{display:none}
.stats{display:grid;grid-template-columns:1fr 1fr 1.35fr;gap:8px}
.stat{background:var(--surface-2);border-radius:12px;padding:9px 11px}
.stat b{display:block;font:700 19px/1.1 var(--display);letter-spacing:-.01em}
.stat span{font-size:11.5px;color:var(--ink-2)}
.search{position:relative}
.search input{width:100%;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0 12px 0 38px;font:inherit}
.search input::placeholder{color:var(--ink-2)}
.search svg{position:absolute;left:12px;top:11px;color:var(--ink-2)}
.list{display:flex;flex-direction:column;gap:2px;margin:0 -6px}
.row{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:12px;padding:8px 8px;border-radius:12px;border:0;background:transparent;text-align:left;width:100%;transition:background .15s}
.row:hover,.row.active{background:var(--surface-2)}
.row .nm{font-weight:600;font-size:14px}
.row .lc{font-size:12.5px;color:var(--ink-2)}
.empty{padding:16px 8px;color:var(--ink-2);font-size:13px}
.sec-t{font:700 13px var(--display);margin:0 0 8px;color:var(--ink)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--surface-2);border-radius:12px;padding:3px}
.seg button{border:0;background:transparent;border-radius:9px;padding:7px 4px;font-size:12.5px;font-weight:500;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(15,43,61,.18);font-weight:600}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13.5px;margin-top:12px}
.switch button{flex:none;width:42px;height:24px;border-radius:99px;border:0;background:var(--track);position:relative;transition:background .2s}
.switch button::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.switch button[aria-checked="true"]{background:var(--water)}
.switch button[aria-checked="true"]::after{transform:translateX(18px)}
.legend{display:grid;gap:7px;margin-top:12px;font-size:12.5px;color:var(--ink-2)}
.legend div{display:flex;align-items:center;gap:9px}
.legend svg{flex:none}
.foot{font-size:11.5px;color:var(--ink-2);display:flex;gap:7px;align-items:flex-start;line-height:1.4}
.dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-top:5px}
.dot.off{background:var(--warn)}

/* ---------- Marcadores ---------- */
.mk{position:relative;width:46px;height:54px;filter:drop-shadow(0 4px 6px rgba(10,22,32,.35));transition:transform .15s}
.mk:hover,.mk.hl{transform:translateY(-3px) scale(1.07)}
.mk svg{display:block}
.mk::after{content:"";position:absolute;left:50%;bottom:4px;width:12px;height:12px;background:var(--surface);transform:translateX(-50%) rotate(45deg);border-radius:0 0 3px 0;z-index:-1}
.mk text,.ring text{font:700 13px var(--display);fill:var(--ink)}
.gm{display:grid;place-items:center;filter:drop-shadow(0 2px 3px rgba(10,22,32,.4))}

/* ---------- Popup ---------- */
.leaflet-popup-content-wrapper.pp{background:var(--surface);color:var(--ink);border-radius:16px;box-shadow:var(--shadow);padding:0}
.pp .leaflet-popup-content{margin:0;width:292px!important}
.leaflet-popup-tip{background:var(--surface)}
.pp-in{padding:16px 16px 14px}
.pp-in h3{font:700 18px/1.2 var(--display);margin:0 0 3px;letter-spacing:-.01em}
.pp-in .sub{color:var(--ink-2);font-size:12.5px;margin-bottom:10px}
.pp-in .ctr{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12.5px;margin-bottom:12px}
.pp-in .ctr dt{color:var(--ink-2)}
.pp-in .ctr dd{margin:0;font-weight:600;word-break:break-all}
.pp-acts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:14px}
.pp-acts .btn{justify-content:center}
.pp-acts .btn.primary{grid-column:1/-1;padding:9px 11px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 8px;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:6px;transition:background .15s}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.primary:hover{filter:brightness(1.12)}
.leaflet-container a.leaflet-popup-close-button{color:var(--ink-2);top:8px;right:8px}

/* ---------- Estado y tubo de avance ---------- */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px 3px 8px;border-radius:99px;background:color-mix(in srgb,var(--c,var(--ink-2)) 14%,transparent);color:var(--ink);white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c,var(--ink-2))}
.pill.ejecucion{--c:var(--water)} .pill.suspendido{--c:var(--warn)} .pill.terminado,.pill.liquidado{--c:var(--ok)} .pill.juridico{--c:var(--bad)}
.pipe{--c:var(--water)}
.pipe.warn{--c:var(--warn)} .pipe.bad{--c:var(--bad)}
.pipe-track{position:relative;height:14px;border-radius:99px;background:var(--track);box-shadow:inset 0 1px 2px rgba(10,22,32,.16)}
.pipe-track::before{content:"";position:absolute;inset:0;border-radius:99px;pointer-events:none;background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 1px),color-mix(in srgb,var(--ink) 13%,transparent) calc(10% - 1px) 10%)}
.pipe-fill{height:100%;width:0;border-radius:99px;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 68%,#fff),var(--c) 48%,color-mix(in srgb,var(--c) 82%,#000));transition:width .9s cubic-bezier(.2,.7,.2,1)}
.pipe-tick{position:absolute;top:-5px;bottom:-5px;width:3px;margin-left:-1.5px;border-radius:2px;background:var(--ink)}
.pipe-vals{display:flex;justify-content:space-between;gap:8px;margin-top:6px;font-size:12.5px;color:var(--ink-2)}
.pipe-vals b{color:var(--ink);font-size:13.5px}
.pipe.none .pipe-vals{margin:0;font-style:italic}
.pipe.sm .pipe-track{height:10px}.pipe.sm .pipe-tick{top:-3px;bottom:-3px;width:2px}.pipe.sm .pipe-vals{margin-top:4px;font-size:11.5px;white-space:nowrap}.pipe.sm .pipe-vals b{font-size:12px}
.na{color:var(--ink-2);font-style:italic}

/* ---------- Ficha lateral ---------- */
#drawer{position:absolute;z-index:1200;top:0;right:0;bottom:0;width:min(var(--drawer-w),100vw);background:var(--surface);box-shadow:-12px 0 40px rgba(10,22,32,.22);display:flex;flex-direction:column;transform:translateX(104%);transition:transform .35s cubic-bezier(.2,.8,.2,1);visibility:hidden}
#drawer.open{transform:none;visibility:visible}
.d-head{padding:18px 20px 0;border-bottom:1px solid var(--line);background:var(--surface)}
.d-top{display:flex;align-items:flex-start;gap:12px}
.d-top h2{font:700 25px/1.12 var(--display);letter-spacing:-.015em;margin:0}
.d-top .sub{color:var(--ink-2);font-size:13px;margin-top:3px}
.tabs{display:flex;gap:2px;margin-top:14px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:transparent;padding:10px 12px;font-weight:600;font-size:13.5px;color:var(--ink-2);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--water)}
.d-body{flex:1;overflow:auto;padding:20px;background:var(--surface)}
.d-body>section{display:none;flex-direction:column;gap:22px}
.d-body>section.on{display:flex}
.h{font:700 15px var(--display);margin:0 0 10px;letter-spacing:-.005em}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surface-2);border-radius:14px;padding:13px 14px}
.kpi .l{font-size:12px;color:var(--ink-2)}
.kpi .v{font:700 21px/1.15 var(--display);letter-spacing:-.01em;margin:3px 0 2px}
.kpi .s{font-size:12px;color:var(--ink-2)}
.stack{display:flex;flex-direction:column;gap:14px}
.lbl{font-size:12.5px;color:var(--ink-2);margin-bottom:5px;display:flex;justify-content:space-between}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--surface-2);border-radius:99px;padding:4px 11px;font-size:12.5px}
.prose{margin:0;font-size:14px;line-height:1.6;max-width:68ch}
.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.more{background:none;border:0;padding:0;margin-top:6px;color:var(--pipe);font-weight:600;font-size:13px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.card{border:1px solid var(--line);border-radius:16px;padding:16px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-h h3{font:700 16px var(--display);margin:0}
dl.kv{margin:0;display:grid;grid-template-columns:1fr;gap:10px}
dl.kv>div{display:grid;gap:1px}
dl.kv dt{font-size:12px;color:var(--ink-2)}
dl.kv dd{margin:0;font-size:13.5px;font-weight:500;overflow-wrap:anywhere}
dl.kv dd small{display:block;color:var(--ink-2);font-weight:400;font-size:12px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-weight:500;color:var(--ink-2);font-size:12px;padding:0 8px 8px 0}
table.t td{padding:10px 8px 10px 0;border-top:1px solid var(--line);vertical-align:top}
.ln{display:flex;gap:9px;align-items:flex-start;font-weight:600}
.ln svg{flex:none;margin-top:2px}
.ln button{border:0;background:none;padding:0;text-align:left;font-weight:600;color:inherit}
.ln button:hover{color:var(--pipe);text-decoration:underline}
.tl{list-style:none;margin:0;padding:0 0 0 20px;position:relative}
.tl::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--line);border-radius:2px}
.tl li{position:relative;padding:0 0 18px}
.tl li::before{content:"";position:absolute;left:-20px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--c,var(--ink-2));border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.tl .when{font-size:12px;color:var(--ink-2)}
.tl .what{font-weight:600;font-size:14px}
.tl p{margin:4px 0 0;font-size:13px;color:var(--ink-2)}
.tl details summary{cursor:pointer;color:var(--pipe);font-weight:600;font-size:12.5px;margin-top:4px}
.tl .c-suspension{--c:var(--warn)} .tl .c-prorroga{--c:var(--pipe)} .tl .c-adicion{--c:var(--ok)} .tl .c-otrosi{--c:var(--indigo)}
.d-foot{font-size:12px;color:var(--ink-2)}

/* ---------- Móvil ---------- */
@media (min-width:861px){#app.drawer-open .leaflet-right{right:var(--drawer-w)}}
@media (max-width:860px){
  #panel{top:auto;left:8px;right:8px;bottom:8px;width:auto;max-height:62vh}
  .leaflet-bottom.leaflet-right{margin-bottom:0}
  #drawer{width:100vw}
  .kpis{grid-template-columns:1fr 1fr}
  .d-top h2{font-size:22px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app">
  <div id="map" aria-label="Mapa de proyectos"></div>

  <aside id="panel" aria-label="Lista de proyectos">
    <div class="p-head">
      <svg class="logo" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="12" fill="#0F2B3D"/><path d="M20 7.500c5.200 6.300 8.800 10.700 8.800 15a8.800 8.800 0 0 1-17.600 0c0-4.300 3.600-8.700 8.800-15z" fill="#33C6D4"/><path d="M15 24.500c1.200 2.600 3 3.800 5.600 4" stroke="#fff" stroke-width="2" stroke-linecap="round" fill="none" opacity=".85"/></svg>
      <div><h1>Visor de proyectos</h1><p>Red Matriz de Acueducto, Bogotá</p></div>
      <span class="spacer"></span>
      <button class="icon-btn" id="themeBtn" aria-label="Cambiar entre tema claro y oscuro" title="Tema claro u oscuro"></button>
      <button class="icon-btn" id="collapseBtn" aria-label="Mostrar u ocultar la lista" aria-expanded="true" title="Mostrar u ocultar la lista"></button>
    </div>
    <div class="p-body" id="pBody">
      <div class="stats" id="stats"></div>
      <label class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.500-3.500"/></svg>
        <input id="q" type="search" placeholder="Buscar proyecto, localidad o contrato" aria-label="Buscar proyecto, localidad o contrato" autocomplete="off"></label>
      <div class="list" id="list" role="list"></div>
      <div>
        <h2 class="sec-t">Mapa</h2>
        <div class="seg" id="baseSeg" role="group" aria-label="Mapa base">
          <button data-base="claro" aria-pressed="true">Claro</button><button data-base="oscuro" aria-pressed="false">Oscuro</button>
          <button data-base="calles" aria-pressed="false">Calles</button><button data-base="satelite" aria-pressed="false">Satélite</button>
        </div>
        <div class="switch"><span id="swLbl">Mostrar la geometría de todos los proyectos</span><button id="allGeom" role="switch" aria-checked="false" aria-labelledby="swLbl"></button></div>
        <div class="legend" aria-label="Leyenda">
          <div><svg width="26" height="10"><line x1="2" y1="5" x2="24" y2="5" stroke="var(--pipe)" stroke-width="4" stroke-linecap="round"/></svg>Tubería (línea de impulsión o distribución)</div>
          <div><svg width="26" height="18" viewBox="0 0 26 18"><rect x="4" y="1" width="18" height="16" rx="5" fill="var(--water)" stroke="var(--surface)" stroke-width="2"/></svg>Tanque de almacenamiento</div>
          <div><svg width="26" height="18" viewBox="0 0 26 18"><circle cx="13" cy="9" r="7.500" fill="var(--indigo)" stroke="var(--surface)" stroke-width="2"/></svg>Estación de bombeo o instrumentación</div>
        </div>
      </div>
      <div class="foot"><span class="dot" id="srcDot"></span><span id="srcTxt"></span></div>
    </div>
  </aside>

  <section id="drawer" role="dialog" aria-modal="false" aria-labelledby="dTitle" aria-hidden="true">
    <div class="d-head">
      <div class="d-top">
        <div style="flex:1;min-width:0"><h2 id="dTitle"></h2><div class="sub" id="dSub"></div></div>
        <button class="icon-btn" id="dClose" aria-label="Cerrar la ficha"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.400" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </div>
      <div class="tabs" role="tablist" id="tabs">
        <button role="tab" data-tab="resumen" aria-selected="true">Resumen</button>
        <button role="tab" data-tab="contratos" aria-selected="false">Contratos</button>
        <button role="tab" data-tab="avance" aria-selected="false">Avance por línea</button>
        <button role="tab" data-tab="finanzas" aria-selected="false">Finanzas y modificaciones</button>
      </div>
    </div>
    <div class="d-body" id="dBody">
      <section id="t-resumen" class="on" role="tabpanel"></section>
      <section id="t-contratos" role="tabpanel"></section>
      <section id="t-avance" role="tabpanel"></section>
      <section id="t-finanzas" role="tabpanel"></section>
    </div>

lo que permitió dar continuidad a las labores de instalación de la línea matriz y a la construcción de las estructuras complementarias asociadas al proyecto.", "indirectos": 10, "supervisor": "Fernando Muñetones Buitrago"}, "estado": "en ejecucion", "lineas": [{"pep": "DM-1007-003", "valor": 10964561680.0, "avance": {"atraso": 21.99, "estado": "Avance: Se ejecutaron actividades constructivas, concentrando los trabajos principalmente en el tramo N.º 1. En dicho período se llevaron a cabo labores de excavación, instalación de tubería habiéndose instalado a la fecha seiscientos treinta seis metros con cincuenta y cuatro centímetros (636.54) de tubería y accesorios especiales de Ø24”, así como actividades de relleno, compactación, y adecuación de las áreas de trabajo. Asimismo, se realizaron actividades de soldadura, pruebas de control de calidad, aplicación de recubrimientos y morteros de protección, y demás labores requeridas para la conformación de la red matriz.\nPor otra parte, se avanzó en la construcción de la cámara N.º 01 mediante la ejecución de excavaciones mecánicas y manuales, instalación de entibado metálico y colocación de concretos de limpieza. De manera paralela, se realizaron actividades permanentes de control topográfico, verificación de niveles y revisión de las condiciones geométricas de las excavaciones garantizando el cumplimiento de las especificaciones técnicas del proyecto.\nFinalmente, se efectuó el suministro y recepción de tubería y accesorios necesarios para la continuidad de las obras, lo que permitió dar continuidad a las labores de instalación de la línea matriz y a la construcción de las estructuras complementarias asociadas al proyecto.\n\nCausas del atraso: Se evidencia un retraso acumulado del 21,99 % respecto a la programación vigente del proyecto, situación atribuible principalmente a la falta de PMT en los tramos 3 y 4 y el vencimiento de la vigencia del PMT de los tramos 8 y 9. En particular, el tramo N.º 3 debía encontrarse finalizado en el mes de septiembre de 2026; no obstante, a la fecha de corte no registra inicio de actividades. De igual manera, el tramo N.º 4, cuyo inicio estaba previsto durante el mes de septiembre de 2026, el cual actualmente continúa sin iniciar. Asimismo, el tramo N.º 1, cuya fecha programada de inicio correspondía al 17 de julio de 2026, inicio el 13 de agosto y a la fecha no ha culminado.\nEn cuanto a la construcción de las cámaras, se presentaron atrasos en el inicio de las actividades correspondientes a las cámaras N.º 12 y N.º 13 del frente de obra Tramo 8, así como también se evidencia atrasos en las cámaras N.º 2, N.º 3 y N.º 4.\nFinalmente, en lo referente a la recuperación del espacio público, a la fecha de corte debía haberse entregado la totalidad del espacio correspondiente a los tramos N.º 9 y N.º 10. Sin embargo, en dichos tramos aún se encuentran actividades de obra, por lo que se presenta un bajo porcentaje de avance en lo concerniente a este hito.\nEs de aclarar que de estos avances se le ha venido informando a la compañía de seguros.", "fin_prog": 31.07, "fin_real": 15.87, "fis_prog": 37.29, "fis_real": 19.37}, "nombre": "LÍNEA MATRIZ BOSA III"}], "numero": "1-01-25400-1630-2024", "objeto": "CONSTRUCCIÓN DE LA LÍNEA MATRIZ BOSA III", "unidad": "MES", "alcance": null, "anticipo": {"saldo": 2103023761.0, "valor": 2574359023.0, "amortizado": 471335262.0}, "empresas": [{"nit": "900076133-2", "nombre": "nema ingenieria sas", "participacion": 100.0}], "fin_inicial": "2026-10-19", "fin_vigente": "2027-07-08", "valor_total": 10964561680.0, "fecha_inicio": "2025-02-13", "retegarantia": null, "representante": "nema ingenieria sas", "valor_inicial": 10964561680.0, "modificaciones": [{"acto": null, "fecha": "2025-04-08", "valor": 0.0, "adicion": "no", "concepto": "suspension", "nueva_fecha": "2026-12-26", "nuevo_valor": 10964561680.0, "justificacion": "Suspensión 1"}, {"acto": null, "fecha": "2025-06-15", "valor": 0.0, "adicion": "no", "concepto": "prorroga }
function clampButtons(){
  [["alc","alcMore"],["act","actMore"]].forEach(([a,b]) => { const t = document.getElementById(a), m = document.getElementById(b); if (t && m && t.scrollHeight > t.clientHeight + 2) m.hidden = false; });
}
(async function init(){
  const {data, live} = await loadData();
  DATA = data; P = (data.proyectos || []).filter(p => p.obra);
  setTheme(matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  map = L.map("map", {zoomControl:false, attributionControl:false, preferCanvas:false, zoomSnap:.25}).setView([4.65,-74.1], 11);
  L.control.attribution({position: mobile() ? "topright" : "bottomright"}).addTo(map);
  if (!mobile()) L.control.zoom({position:"bottomright", zoomInTitle:"Acercar", zoomOutTitle:"Alejar"}).addTo(map);
  setBase(document.documentElement.dataset.theme === "dark" ? "oscuro" : "claro");
  P.forEach(p => {
    if (!p.centro) return;
    const m = L.marker(p.centro, {icon:markerIcon(p), title:p.nombre, keyboard:true, riseOnHover:true}).addTo(map);
    m.bindPopup(() => popupHTML(p), {className:"pp", minWidth:292, maxWidth:292, autoPanPaddingTopLeft:[mobile()?20:400,20], autoPanPaddingBottomRight:[20,20]});
    m.on("popupopen", () => animatePipes(document.querySelector(".leaflet-popup")));
    m.on("click", () => { try { history.replaceState(null,"","#" + p.slug); } catch(e){} });
    markers[p.slug] = m;
  });
  const total = P.reduce((s,p) => s + sumVal(p), 0), nctr = P.reduce((s,p) => s + 1 + (p.interventoria ? 1 : 0), 0);
  document.getElementById("stats").innerHTML = `<div class="stat"><b>${P.length}</b><span>proyectos</span></div><div class="stat"><b>${nctr}</b><span>contratos</span></div><div class="stat"><b>${bigParts(total)[0]}</b><span>${bigParts(total)[1]} contratados</span></div>`;
  const gen = data.generado ? new Date(data.generado).toLocaleDateString("es-CO",{day:"numeric",month:"long",year:"numeric"}) : "";
  const av = P.map(p => p.obra.avance).filter(Boolean)[0];
  document.getElementById("srcDot").classList.toggle("off", !live);
  document.getElementById("srcTxt").textContent = (live ? "Datos en vivo desde la base de datos." : `Datos de la base al ${gen}.`) + (av ? ` Avance con corte de ${fmtMonth(av.mes, av.ano)}.` : "");
  wire(); renderList(""); fitAll();
  setCollapsed(mobile());
  const h = decodeURIComponent((location.hash || "").slice(1)); if (h && P.some(p => p.slug === h)) openDrawer(h);
  window.addEventListener("hashchange", () => { const k = decodeURIComponent((location.hash || "").slice(1)); if (k && P.some(p => p.slug === k) && k !== current) openDrawer(k); });
  new MutationObserver(clampButtons).observe(document.getElementById("dBody"), {childList:true, subtree:true});
  document.getElementById("drawer").addEventListener("transitionend", clampButtons);
})();
</script>
